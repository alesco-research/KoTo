[project]
name = "koopman-tutorial"
version = "0.1.0"
description = "This is the TCLab tutorial on Koopman control methods."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "ty>=0.0.82",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "N", "F", "B", "UP", "I", "SIM", "ARG"]
ignore = ["ARG002"] # ignore unused arguments

[tool.ty.src]
exclude = ["**/__pycache__"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = false